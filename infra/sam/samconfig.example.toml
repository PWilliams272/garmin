version = 0.1

[default.build.parameters]
template_file = "infra/sam/template.yaml"

[default.deploy.parameters]
stack_name = "garmin-data-updater-managed"
region = "us-east-2"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
parameter_overrides = "FunctionName=garmin-data-updater-managed GarminS3Bucket=my-garmin-data GarminSecretName=garmin/oauth2_token ScheduleExpression='rate(1 day)' ScheduleEnabled=true"