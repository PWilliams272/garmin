name: Deploy Garmin Lambda

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

      - name: Create deployment package directory
        run: |
          mkdir lambda_build
          rsync -av --exclude 'app/' src/garmin/ lambda_build/garmin/
          cp src/garmin/requirements-lambda.txt lambda_build/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r lambda_build/requirements.txt -t lambda_build/

      - name: Zip deployment package
        run: |
          cd lambda_build
          zip -r ../lambda_deploy.zip .

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name garmin-data-updater \
            --zip-file fileb://lambda_deploy.zip

      - name: Wait for code update
        run: |
          aws lambda wait function-updated \
            --function-name garmin-data-updater

      - name: Update Lambda environment
        run: |
          aws lambda update-function-configuration \
            --function-name garmin-data-updater \
            --environment 'Variables={GARMIN_USE_AWS_SECRETS=1,GARMIN_AWS_SECRET_NAME=garmin/oauth2_token,GARMIN_S3_BUCKET=my-garmin-data}'
