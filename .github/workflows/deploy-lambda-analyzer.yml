name: Deploy Garmin Analyzer Lambda

on:
  push:
    branches:
      - prod
    paths:
      - 'src/garmin/**'
      - 'infra/docker/analyzer.Dockerfile'
      - '.github/workflows/deploy-lambda-analyzer.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: garmin-data-analyzer
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            -f infra/docker/analyzer.Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push .

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name garmin-data-analyzer \
            --image-uri ${{ steps.ecr-login.outputs.registry }}/garmin-data-analyzer:${{ github.sha }}

      - name: Wait for update to finish
        run: |
          aws lambda wait function-updated \
            --function-name garmin-data-analyzer
