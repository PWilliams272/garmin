name: Deploy Garmin EC2
on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Debug connectivity to EC2
        run: |
          ping -c 4 ${{ secrets.EC2_HOST_DNS }} || true
          nc -zv ${{ secrets.EC2_HOST_DNS }} 22 || true

      - name: Deploy Garmin repo to EC2 via rsync
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST_DNS }}
          REMOTE_USER: ${{ secrets.EC2_USERNAME }}
          TARGET: ${{ secrets.EC2_GARMIN_TARGET_DIR }}