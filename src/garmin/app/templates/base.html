<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Garmin Dashboard{% endblock %}</title>
    <link href="{{ url_for('garmin.static', filename='css/tokens.css') }}" rel="stylesheet">
    <link href="{{ url_for('garmin.static', filename='css/app.css') }}" rel="stylesheet">
    <link href="https://cdn.bokeh.org/bokeh/release/bokeh-3.7.3.min.css" rel="stylesheet" type="text/css">
    <script src="https://cdn.bokeh.org/bokeh/release/bokeh-3.7.3.min.js"></script>
    <script src="https://cdn.bokeh.org/bokeh/release/bokeh-widgets-3.7.3.min.js"></script>
    <script src="https://cdn.bokeh.org/bokeh/release/bokeh-tables-3.7.3.min.js"></script>
    <script src="https://cdn.bokeh.org/bokeh/release/bokeh-gl-3.7.3.min.js"></script>
    <style>
        .message { color: var(--lg-text-2); text-align: center; font-size: 1.1rem; margin-top: 2rem; }
        hr { margin: 2.5rem 0; border: none; border-top: 1px solid var(--lg-border); }
        .container { width: 100%; max-width: var(--lg-content-max); margin: 0 auto; padding: 24px; }
        @media (max-width: 768px) {
            .container { padding: 16px 12px; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
