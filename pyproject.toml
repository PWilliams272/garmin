[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin"
version = "0.1.0"
description = "A project for pulling, processing, and visualizing Garmin data."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "pandas>=2.2",
    "numpy>=2.2",
    "sqlalchemy>=2.0",
    "bokeh>=3.7",
    "tqdm>=4.67",
    "python-dotenv>=1.1",
    "python-dateutil>=2.9",
    "matplotlib>=3.10",
    "requests>=2.32",
    "curl-cffi>=0.7",
    "psycopg2>=2.9",
    "fastparquet",
    "boto3>=1.35",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "myutils @ git+https://github.com/PWilliams272/myutils.git@prod",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "moto[s3,secretsmanager]>=5.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pandas-stubs>=2.2",
    "boto3-stubs[s3,secretsmanager]>=1.35",
]

[project.scripts]
garmin = "garmin.app.app:main"

# ---------------------------------------------------------------------------
# Packaging — src layout
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting (replaces flake8, isort, pyupgrade)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: do not perform function calls in default arguments (Flask uses this pattern)
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["garmin"]

# ---------------------------------------------------------------------------
# Mypy — static type checking (start permissive, tighten incrementally)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=garmin --cov-report=term-missing"
